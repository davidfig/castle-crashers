<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screens Workbench</title>
<style>
  :root { --bg:#14121a; --panel:#1d1a25; --line:#322d3f; --fg:#e6e0d4; --dim:#8d8697; --acc:#e8873a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display:block; background:#000; }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:14px; margin:0 12px 0 0; letter-spacing:.08em; text-transform:uppercase; color:var(--acc); }
  header a { color:var(--dim); }
  select, button, input { background:var(--panel); color:var(--fg); border:1px solid var(--line); padding:4px 8px; font:inherit; border-radius:3px; cursor:pointer; }
  button.on { border-color:var(--acc); color:var(--acc); }
  label { color:var(--dim); display:flex; gap:6px; align-items:center; }
  main { padding:16px; display:grid; gap:16px; grid-template-columns: auto minmax(280px, 1fr); align-items:start; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:12px; min-width:0; overflow:auto; }
  section h2 { margin:0 0 10px; font-size:11px; color:var(--dim); letter-spacing:.1em; text-transform:uppercase; font-weight:500; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  .note { color:var(--dim); margin:6px 0 0; }
  #err { color:#ff7b6b; white-space:pre-wrap; }
  #words p { margin:0 0 8px; }
  #words .who { color:var(--acc); }
  #words .cur { background:#2a2438; outline:1px solid var(--acc); }
  #words .narr { color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>Screens Workbench</h1>
  <a href="/">sprites</a>
  <label>screen <select id="screen"></select></label>
  <label>zoom <select id="zoom"><option>1</option><option selected>2</option><option>3</option></select></label>
  <button id="pause">pause</button>
  <span id="err"></span>
</header>
<main>
  <section>
    <h2 id="title">&nbsp;</h2>
    <canvas id="game" width="1280" height="720" style="width:1280px;height:720px"></canvas>
    <div class="row" id="pager" style="margin-top:10px">
      <button id="prev">&larr; beat</button><span id="pageNo"></span><button id="next">beat &rarr;</button>
    </div>
    <div class="row" id="partyRow"><span style="color:var(--dim)">party</span></div>
    <div class="row" id="chapterRow"><label>chapter <select id="chapter"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label></div>
    <p class="note">Drawn by the game's own renderer (src/render/*), so what you see is what ships. Save any file in src/ or art/ and this page reloads. Deep link: <code>?screen=scene:intro:bounty&amp;page=2&amp;party=archer,mage</code></p>
  </section>
  <section>
    <h2>The words</h2>
    <div id="words"></div>
  </section>
</main>
<script type="module" src="/screens.js"></script>
</body>
</html>
